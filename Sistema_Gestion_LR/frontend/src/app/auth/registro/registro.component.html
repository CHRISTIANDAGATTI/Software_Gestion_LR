<h2>Registro</h2>
<form (ngSubmit)="onSubmit()" class="form-registro">
  <div class="form-group">
    <label for="username">Nombre de usuario</label>
    <input id="username" type="text" [(ngModel)]="username" name="username" placeholder="Ej: usuario123" required>
  </div>
  <div class="form-group">
    <label for="full_name">Nombre completo</label>
    <input id="full_name" type="text" [(ngModel)]="full_name" name="full_name" placeholder="Ej: Juan Pérez" required>
  </div>
  <div class="form-group">
    <label for="dni">DNI</label>
    <input id="dni" type="text" [(ngModel)]="dni" name="dni" placeholder="Ej: 12345678" required>
  </div>
  <div class="form-group">
    <label for="telefono">Teléfono</label>
    <input id="telefono" type="text" [(ngModel)]="telefono" name="telefono" placeholder="Ej: 1122334455" required>
  </div>
  <div class="form-group">
    <label for="email">Email</label>
    <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="Ej: correo@dominio.com" required>
  </div>
  <div class="form-group">
    <label for="password">Contraseña</label>
    <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Mínimo 6 caracteres" required>
  </div>
  <button type="submit">Registrarse</button>
  <div *ngIf="error" class="feedback error">
    <span>❌ {{ error }}</span>
  </div>
  <div *ngIf="success" class="feedback success">
    <span>✅ {{ success }}</span>
  </div>
</form>
<p>¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión aquí</a></p>
