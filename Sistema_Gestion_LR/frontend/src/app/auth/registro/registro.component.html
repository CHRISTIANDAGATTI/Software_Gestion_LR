<h2>Registro</h2>
<form (ngSubmit)="onSubmit()">
  <div>
    <label for="username">Nombre de usuario</label>
    <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="Nombre de usuario" required />
  </div>
  <div>
    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" [(ngModel)]="full_name" name="full_name" placeholder="Nombre completo" required />
  </div>
  <div>
    <label for="dni">DNI</label>
    <input type="text" id="dni" [(ngModel)]="dni" name="dni" placeholder="DNI" required />
  </div>
  <div>
    <label for="telefono">Teléfono</label>
    <input type="text" id="telefono" [(ngModel)]="telefono" name="telefono" placeholder="Teléfono" required />
  </div>
  <div>
    <label for="email">Email</label>
    <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Tu correo electrónico" required />
  </div>
  <div>
    <label for="password">Contraseña</label>
    <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Elegí una contraseña" required />
  </div>
  <button type="submit">Crear cuenta</button>
</form>
<p>¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión aquí</a></p>
<div *ngIf="error" style="color:red">{{ error }}</div>
<div *ngIf="success" style="color:green">{{ success }}</div>
