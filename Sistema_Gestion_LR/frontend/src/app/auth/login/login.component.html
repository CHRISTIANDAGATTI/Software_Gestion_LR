<h2>Login</h2>
<form (ngSubmit)="onSubmit()">
  <div>
    <label for="email">Email</label>
    <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Ingresá tu email" required />
  </div>
  <div>
    <label for="password">Contraseña</label>
    <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Ingresá tu contraseña" required />
  </div>
  <button type="submit">Iniciar Sesión</button>
</form>
<div *ngIf="error" style="color:red">{{ error }}</div>
<p>¿No tenés cuenta? <a routerLink="/registro">Registrate aquí</a></p>
