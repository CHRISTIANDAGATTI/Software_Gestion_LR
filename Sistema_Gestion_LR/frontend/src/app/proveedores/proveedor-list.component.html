<div style="max-width: 900px; margin: 0 auto;">
  <h2>Lista de Proveedores</h2>
  <div style="display: flex; gap: 1em; align-items: center; margin-bottom: 1em;">
    <button (click)="nuevoProveedor()">Agregar Proveedor</button>
    <input type="text" placeholder="Buscar por nombre o razón social" [(ngModel)]="busquedaNombre" style="width: 200px;" />
    <input type="text" placeholder="Buscar por CUIT o DNI" [(ngModel)]="busquedaDocumento" style="width: 160px;" />
    <button (click)="limpiarBusqueda()">Limpiar</button>
  </div>
  <table border="1" style="width: 100%;">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Razón Social</th>
        <th>CUIT</th>
        <th>DNI</th>
        <th>Teléfono</th>
        <th>Email</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let proveedor of proveedoresPaginados()">
        <td>{{ proveedor.nombre }}</td>
        <td>{{ proveedor.razon_social }}</td>
        <td>{{ proveedor.cuit }}</td>
        <td>{{ proveedor.dni }}</td>
        <td>{{ proveedor.telefono }}</td>
        <td>{{ proveedor.email }}</td>
        <td>
          <button (click)="editarProveedor(proveedor.id)">Editar</button>
          <button (click)="eliminarProveedor(proveedor.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div style="margin: 1em 0; display: flex; justify-content: center; align-items: center; gap: 1em;">
    <button (click)="cambiarPagina(paginaActual - 1)" [disabled]="paginaActual === 1">Anterior</button>
    <span>Página {{paginaActual}} de {{totalPaginas}}</span>
    <button (click)="cambiarPagina(paginaActual + 1)" [disabled]="paginaActual === totalPaginas">Siguiente</button>
  </div>
</div>
