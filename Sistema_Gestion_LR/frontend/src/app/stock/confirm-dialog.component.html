

<div mat-dialog-title>{{ data.title || 'Confirmar acción' }}</div>
<mat-dialog-content>
  <p>{{ data.message }}</p>
  <div *ngIf="data.error" class="dialog-error">
    {{ data.error }}
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onConfirm()">Aceptar</button>
</mat-dialog-actions>
