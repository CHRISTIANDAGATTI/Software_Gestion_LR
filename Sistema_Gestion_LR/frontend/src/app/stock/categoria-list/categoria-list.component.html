<div class="categoria-list">
  <h3>Listado de Categorías</h3>
  <button [routerLink]="['/stock/categoria/agregar']" style="margin-bottom: 1em;">Agregar Categoría</button>
  <table border="1">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let categoria of categorias">
        <td>{{ categoria.nombre }}</td>
        <td>{{ categoria.descripcion }}</td>
        <td>
          <button (click)="editarCategoria(categoria.id)">Editar</button>
          <button (click)="eliminarCategoria(categoria.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<div *ngIf="showConfirmModal" class="modal-flotante">
  <div class="modal-contenido">
    <h3>{{ confirmModalData.title }}</h3>
    <p>{{ confirmModalData.message }}</p>
    <div *ngIf="confirmModalData.error" class="error-modal">{{ confirmModalData.error }}</div>
    <div style="display: flex; gap: 1em; justify-content: flex-end; margin-top: 1em;">
      <button (click)="confirmarEliminarCategoria(true)">Confirmar</button>
      <button (click)="confirmarEliminarCategoria(false)">Cancelar</button>
    </div>
  </div>
</div>
